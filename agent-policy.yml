version: 1

default: prohibited

status_values:
  - allowed
  - approval_required
  - prohibited

permissions:
  repository_read:
    status: allowed
    constraints:
      - Respect ignore files, access controls, and data-classification rules.
  repository_write:
    status: allowed
    constraints:
      - Work on an agent-owned branch or isolated worktree.
      - Make changes necessary for the current product request and record material decisions.
  shell_read_only:
    status: allowed
  shell_mutating_repository:
    status: allowed
    constraints:
      - Use reversible repository or disposable local-environment changes.
      - Confirm before intentionally destructive commands or broad deletion.
  shell_outside_repository:
    status: approval_required
  network_documentation:
    status: allowed
    constraints:
      - Prefer authoritative, versioned primary sources.
  network_arbitrary_download:
    status: approval_required
  package_inspection:
    status: allowed
  package_install_development:
    status: allowed
    constraints:
      - Verify package existence, publisher, version, license, maintenance, and repository alternatives.
  package_install_production:
    status: allowed
    constraints:
      - The dependency must be necessary for the current product request and verified against authoritative sources.
      - Escalate material license, supply-chain, cost, privilege, data-transfer, or architecture consequences.
  local_disposable_database:
    status: allowed
  shared_development_database:
    status: approval_required
  staging_database:
    status: approval_required
  production_database:
    status: prohibited
  cloud_read:
    status: approval_required
  cloud_mutation:
    status: approval_required
    constraints:
      - Allowed only when a configured integration and scoped authorization cover the target environment.
  github_read:
    status: allowed
  github_branch_commit_pull_request:
    status: allowed
    constraints:
      - Never push directly to the protected default branch.
  github_merge:
    status: approval_required
    constraints:
      - Required checks and configured repository policy must permit the merge.
  github_release_metadata:
    status: approval_required
  github_repository_settings:
    status: prohibited
  preview_deployment:
    status: approval_required
  staging_deployment:
    status: approval_required
  production_deployment:
    status: approval_required
    constraints:
      - Bind authorization to the artifact or commit, target environment, and release conditions.
      - A documented bounded standing authorization may cover qualifying releases.
  secrets_read_or_output:
    status: prohibited
  managed_secret_injection:
    status: allowed
    constraints:
      - Never print, export, commit, or broadly inspect the secret value.
  external_communications:
    status: prohibited

approval_rules:
  - Approval is scoped to the action, resource, account, environment, and current product request or recorded standing authorization.
  - Equivalent permitted tools may be substituted when they do not expand the action or data boundary.
  - Human direction cannot authorize secret exposure or violation of platform or organization policy.
  - When a required capability is unavailable, complete independent permitted work and report the specific blocker.
